name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'ビルドするv*タグ（新規作成は下の項目で明示）'
        required: true
        type: string
      create_tag:
        description: '新規の安定版タグを現在のmainから作成する（既存タグは変更しない）'
        default: false
        type: boolean
      publish:
        description: '検証後に安定版Releaseを公開する（プレリリースタグはdraftのまま）'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create explicitly requested stable tag from main
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$source_sha" = "$DISPATCH_SHA"
          tag_endpoint="repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG"
          tag_query=".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .object.sha"
          existing_sha=$(gh api "$tag_endpoint" --jq "$tag_query")
          if [ -n "$existing_sha" ]; then
            test "$existing_sha" = "$source_sha"
            echo 'The exact tag already points to current main; no write is needed.'
            exit 0
          fi
          # Do not tag a main that changed while the initial reference was read.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$source_sha"
          # A lost write acknowledgement must be reconciled before any later retry.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$source_sha"; then
            echo 'Tag creation did not acknowledge success; checking the exact ref.'
          fi
          observed_sha=$(gh api "$tag_endpoint" --jq "$tag_query")
          test "$observed_sha" = "$source_sha"

  mac-build:
    needs: prepare-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify existing release tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"

      - name: Test and package standalone Macs
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -race -count=1
          python3 scripts/test_macos_tools.py
          go run ./cmd/package-macos -version "$RELEASE_TAG" -out dist

      - uses: actions/upload-artifact@v7
        with:
          name: mac-distributions
          path: dist/*
          if-no-files-found: error

  mac-test:
    needs: mac-build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: mac-distributions
          path: mac-artifacts
      - name: Verify native Mac binary and launcher
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          go test ./... -race -count=1
          python3 scripts/test_macos_tools.py
          (cd mac-artifacts && shasum -a 256 -c macos-checksums.txt)
          unzip "mac-artifacts/"*"_macos_${ARCH}.zip" -d mac-artifacts/extracted
          folder=$(find mac-artifacts/extracted -mindepth 1 -maxdepth 1 -type d)
          test -x "$folder/Start.command"
          for script in "$folder/"*.command "$folder/service-macos.sh"; do
            test -x "$script"
            bash -n "$script"
          done
          test "$("$folder/dependabot-alert-notice" --version)" = "dependabot-alert-notice $RELEASE_TAG"
          test "$("$folder/dependabot-alert-notice" --config "$folder/config.yaml.example" --web-url)" = "http://127.0.0.1:8999"

  release:
    needs: [mac-build, mac-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: mac-distributions
          path: mac-artifacts

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add convenient Mac distributions to draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" mac-artifacts/*.zip mac-artifacts/macos-checksums.txt --repo "$GITHUB_REPOSITORY"

      - name: Publish verified stable Release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Stable SemVer tagではないためdraftを維持します。'
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --title "DevSecOps Console ${RELEASE_TAG}")
          notes_file="packaging/releases/${RELEASE_TAG}.md"
          if [ -f "$notes_file" ]; then
            args+=(--notes-file "$notes_file")
          fi
          gh release edit "$RELEASE_TAG" "${args[@]}"

